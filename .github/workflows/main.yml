name: RaceDay CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  validate-project:
    name: Validate RaceDay Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "Checking RaceDay project structure..."

          test -d docs
          test -f docs/RaceDay.sql
          test -f "docs/endpoint plan.pdf"
          test -f "docs/ERD- Section A.pdf"

          echo "Required project files are present."

      - name: Validate SQL script
        run: |
          echo "Checking SQL script..."

          grep -q "CREATE TABLE Users" docs/RaceDay.sql
          grep -q "CREATE TABLE Events" docs/RaceDay.sql
          grep -q "CREATE TABLE Results" docs/RaceDay.sql
          grep -q "CREATE TABLE Category" docs/RaceDay.sql
          grep -q "CREATE TABLE Enrolment" docs/RaceDay.sql
          grep -q "CREATE TABLE EnrolmentStatus" docs/RaceDay.sql

          echo "All six required entities are present."

      - name: Validate API endpoint plan
        run: |
          echo "Checking API endpoint plan..."

          grep -q "/api/auth" docs/endpoint plan.pdf
          grep -q "/api/profile" docs/endpoint plan.pdf
          grep -q "/api/events" docs/endpoint plan.pdf
          grep -q "/api/categories" docs/endpoint plan.pdf
          grep -q "/api/enrolments" docs/endpoint plan.pdf
          grep -q "/api/results" docs/endpoint plan.pdf

          echo "Required API endpoint sections are present."

      - name: Validation completed
        run: |
          echo "RaceDay CI validation completed successfully."
