name: RaceDay CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  validate-project:
    name: Validate RaceDay Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "Checking RaceDay project structure..."

          test -d docs
          test -f docs/RaceDay.sql
          test -f docs/endpoint plan.pdf

          echo "Required project files are present."

      - name: Validate SQL script
        run: |
          echo "Checking SQL script..."

          grep -q "CREATE TABLE Users" RaceDay.sql
          grep -q "CREATE TABLE Events" RaceDay.sql
          grep -q "CREATE TABLE Results" RaceDay.sql
          grep -q "CREATE TABLE Category" RaceDay.sql
          grep -q "CREATE TABLE Enrolment" RaceDay.sql
          grep -q "CREATE TABLE EnrolmentStatus" RaceDay.sql

          echo "All six required entities are present."

      - name: Validate API endpoint plan
        run: |
          echo "Checking API endpoint plan..."

          grep -q "/api/auth" endpoint plan.pdf
          grep -q "/api/profile" endpoint plan.pdf
          grep -q "/api/events" endpoint plan.pdf
          grep -q "/api/categories" endpoint plan.pdf
          grep -q "/api/enrolments" endpoint plan.pdf
          grep -q "/api/results" endpoint plan.pdf

          echo "Required API endpoint sections are present."

      - name: Validation completed
        run: |
          echo "RaceDay CI validation completed successfully."
