name: RaceDay CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  validate-project:
    name: Validate RaceDay Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "Checking RaceDay project structure..."

          
          test -f RaceDay.sql
          test -f endpoint plan.pdf

          echo "Required project files are present."

      - name: Validate SQL script
        run: |
          echo "Checking SQL script..."

          grep -q "CREATE TABLE Users" docs/RaceDayDatabase.sql
          grep -q "CREATE TABLE Events" docs/RaceDayDatabase.sql
          grep -q "CREATE TABLE Results" docs/RaceDayDatabase.sql
          grep -q "CREATE TABLE Category" docs/RaceDayDatabase.sql
          grep -q "CREATE TABLE Enrolment" docs/RaceDayDatabase.sql
          grep -q "CREATE TABLE EnrolmentStatus" docs/RaceDayDatabase.sql

          echo "All six required entities are present."

      - name: Validate API endpoint plan
        run: |
          echo "Checking API endpoint plan..."

          grep -q "/api/auth" docs/API-Endpoint-Plan.md
          grep -q "/api/profile" docs/API-Endpoint-Plan.md
          grep -q "/api/events" docs/API-Endpoint-Plan.md
          grep -q "/api/categories" docs/API-Endpoint-Plan.md
          grep -q "/api/enrolments" docs/API-Endpoint-Plan.md
          grep -q "/api/results" docs/API-Endpoint-Plan.md

          echo "Required API endpoint sections are present."

      - name: Validation completed
        run: |
          echo "RaceDay CI validation completed successfully."
