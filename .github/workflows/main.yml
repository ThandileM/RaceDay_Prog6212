name: Validate Part 1 Documentation
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  validate-docs-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::/docs folder is missing from the repository root."
            exit 1
          fi
          echo "/docs folder found."

      - name: Check for ERD document
        run: |
          if [ ! -f "docs/ERD- Section A.pdf" ]; then
            echo "::error::Expected docs/ERD- Section A.pdf was not found."
            exit 1
          fi
          echo "ERD file found."

      - name: Check for API endpoint plan
        run: |
          if [ ! -f "docs/endpoint plan.pdf" ]; then
            echo "::error::Expected docs/endpoint plan.pdf was not found."
            exit 1
          fi
          echo "API endpoint plan found."

      - name: Check for SQL script
        run: |
          if [ ! -f "docs/RaceDay.sql" ]; then
            echo "::error::Expected docs/RaceDay.sql was not found."
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists at repository root
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All required Part 1 documents present
        run: echo "Repository structure check passed."
