name: Validate Part 1 Documentation
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  validate-docs-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::/docs folder is missing from the repository root."
            exit 1
          fi
          echo "/docs folder found."

      - name: Check for ERD (PNG or PDF)
        run: |
          if ! find docs -maxdepth 1 -iname "*erd*" \( -iname "*.png" -o -iname "*.pdf" \) | grep -q .; then
            echo "::error::No ERD file found in /docs (expected a .png or .pdf with 'erd' in the filename)."
            exit 1
          fi
          echo "ERD file found."

      - name: Check for API endpoint plan (PDF or Markdown)
        run: |
          if ! find docs -maxdepth 1 -iname "*endpoint*plan*" \( -iname "*.pdf" -o -iname "*.md" \) | grep -q .; then
            echo "::error::No API endpoint plan found in /docs (expected a .pdf or .md with 'endpoint' and 'plan' in the filename)."
            exit 1
          fi
          echo "API endpoint plan found."

      - name: Check for SQL script
        run: |
          if ! find docs -maxdepth 1 -iname "*.sql" | grep -q .; then
            echo "::error::No .sql file found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Check README exists at repository root
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: All required Part 1 documents present
        run: echo "Repository structure check passed."
